<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Roleplay AI Chatbot</title>
  
  <link rel="stylesheet" href="style.css">
  
  <script src="https://unpkg.com/dexie@3.2.4/dist/dexie.js"></script>
</head>
<body>
<div class="toast" id="toast"><span>aawwaa</span></div>
  <div class="overlay" id="settingsOverlay"></div>

  <main class="chat-selection" id="chatSelectionPage">
    <div class="Nav">
      <header class="header">
        <img src="img/tittle.png" id="apps" alt="Judul Aplikasi">
        <div id="ab-box">
          <input type="button" id="about" title="Tentang" onClick="window.location.href = 'tutorial.html';">
        </div>
      </header>

      <section id="tabChatList" class="tab-content active-tab">
        <div class="sub-header">
          <span id="txt-chat">Chat (0)</span>
          <div id="filtering">
            <div id="f-box"><input type="button" id="filter" title="Filter"></div>
            <div id="sh-box"><input type="button" id="short" title="Urutkan"></div>
          </div>
        </div>

        <div style="width:auto">
          <div class="short-by" id="s-short">
            <div class="close">
              <div style="margin-right:7px"><button id="close-"></button></div>
            </div>
            <input type="button" value="Terbaru" id="sortRecent">
            <input type="button" value="Nama" id="sortName">
            <input type="button" value="Bond" id="sortBond">
          </div>
        </div>

        <main class="list-chat" id="listChatContainer">
        </main>
      </section>

      <section id="tabAiSettings" class="tab-content">
        <div class="ai-settings-container">
          
          <!-- PENGATURAN PROFIL USER -->
          <div class="ai-settings-header">
            <span>Pengaturan Profil User</span>
          </div>
          <div class="setting-group">
            <label for="userProfileInput">Deskripsi User / Player:</label>
            <textarea id="userProfileInput" rows="4" placeholder="Deskripsikan karakter diri Anda di sini (misal: Sensei, pria ramah, suka membantu para siswa, dll)..."></textarea>
          </div>

          <!-- PENGATURAN MODEL AI -->
          <div class="ai-settings-header" id="aiSettingsCollapsibleHeader">
            <span>Pengaturan Model AI</span>
            <button id="minimizeAiSettingsBtn" class="minimize-btn" title="Minimize/Expand">—</button>
          </div>

          <div class="ai-settings-body minimized" id="aiSettingsBody">
            <div class="setting-group">
              <label>Gemini API Token / Key:</label>
              <input type="password" id="apiKeyInput" placeholder="Masukkan API Key...">

              <label>Pilih Model AI:</label>
              <select id="modelSelect">
                <option value="gemini-3.6-flash">Gemini 3.6 Flash (Disarankan - Cepat & Stabil)</option>
                <option value="gemini-3.6-pro">Gemini 3.6 Pro (Akurasi Tinggi)</option>
                <option value="gemma-2-27b-it">Gemma 2 27B IT (Free Tier)</option>
              </select>
            </div>

            <div class="setting-group">
              <label>Temperature (Kreativitas): <span id="tempVal">0.7</span></label>
              <input type="range" id="temperatureInput" min="0" max="2" step="0.1" value="0.7">

              <label>Top-K Sampling: <span id="topKVal">40</span></label>
              <input type="number" id="topKInput" value="40" min="1" max="100">

              <label>Top-P Sampling: <span id="topPVal">0.95</span></label>
              <input type="range" id="topPInput" min="0" max="1" step="0.05" value="0.95">

              <label>Max Output Tokens (Panjang Respon Max):</label>
              <input type="number" id="maxTokensInput" value="1024" min="64" max="8192">

              <label>Jumlah Upload Riwayat Pesan:</label>
              <select id="historyUploadSelect">
                <option value="5">5 Pesan Terakhir</option>
                <option value="10">10 Pesan Terakhir</option>
                <option value="20">20 Pesan Terakhir</option>
                <option value="50">50 Pesan Terakhir</option>
                <option value="0">Semua Riwayat</option>
              </select>
            </div>

            
          </div>
          <button id="saveAiSettingsBtn" class="primary-btn">Simpan Pengaturan</button>
        </div>
      </section>
      <nav class="bottom-nav">
      <div class="underline">
      	
      	<div id="c-underline">
		  	<div id="u-box"><div></div></div>
		  </div>
      	
	  </div>
        <div id="navBtnChat" class="nav-item active">
          <div></div>
        </div>
        <div id="navBtnSettings" class="nav-item">
          <div></div>
        </div>
      </nav>

    </div>
  </main>

  <main class="chat-main-wrapper" id="chatMainWrapper">
    <div class="chat-content">
      <div class="bot-info">
        <input type="button" id="back" title="Kembali">
        <div class="ftp-chat">
          <img id="activeAvatar" src="img/shun.png" alt="Avatar">
          <span id="activeName">Pilih Karakter</span>
        </div>
        <input type="button" id="vn" title="visualNovel">
        <input type="button" id="drawer" title="Pengaturan">
      </div>
      
      <div class="chat-b-container" id="chatBox">
	  
	  </div>

      <div class="context-popup" id="contextPopup">
        <div class="context-header">
          <span>Konteks Tambahan System</span>
          <button id="closeContextPopupBtn" class="close-context-btn">&times;</button>
        </div>
        <textarea id="extraContextInput" rows="4" placeholder="Tambahkan instruksi kustom di sini..."></textarea>
        <button id="saveContextBtn" class="primary-btn save-context-btn">Konfirmasi & Simpan</button>
      </div>
	<div class="input">
        <button id="openContextBtn" class="context-toggle-btn" title="Pengaturan Konteks Chat"> </button>
        
        <div contenteditable="true" id="type-box" role="textbox" aria-label="Ketik pesan..." data-placeholder="Ketik pesan..."></div>
        <input type="button" id="sendBtn" value="Kirim">
      </div>
    </div>
      
  </main>

  <div class="floating-settings" id="settingsDrawer">
    <div class="drawer-header">
      <span class="modal-title">Pengaturan Chat</span>
      <button id="closeSettings">×</button>
    </div>

    <div class="controls">
      <label>Tema Tampilan:</label>
      <select id="themeSelect">
        <option value="light">Terang (Light)</option>
        <option value="dark">Gelap (Dark)</option>
      </select>

      <div class="chat-tools">
        <button id="exportBtn">Export Chat</button>
        <button id="importBtn">Import Chat</button>
        <button id="resetBtn" class="danger-btn">Hapus Chat</button>
        <input type="file" id="fileInput" accept=".json" style="display: none;">
      </div>
    </div>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
